<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-box">

        <h1>
            🌍 Quiniela Mundial 2026
        </h1>

        <h2>
            Iniciar Sesión
        </h2>

        <form id="loginForm">

            <input
                type="text"
                id="nombre"
                placeholder="Usuario"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">

                Ingresar

            </button>

        </form>

        <p>

            ¿No tienes cuenta?

            <a href="register.html">

                Registrarse

            </a>

        </p>

    </div>

    <script src="login.js"></script>

</body>

</html>
