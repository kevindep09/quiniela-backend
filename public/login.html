<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .register-link {

            color: #00d4ff;

            font-weight: bold;

            text-decoration: none;

        }

        .register-link:hover {

            color: #ffffff;

            text-decoration: underline;

        }

    </style>

</head>

<body>

    <div class="auth-box">

        <h1>
            🌍 Quiniela Mundial 2026
        </h1>

        <h2>
            Iniciar Sesión
        </h2>

        <form id="loginForm">

            <input
                type="text"
                id="nombre"
                placeholder="Usuario"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">

                Ingresar

            </button>

        </form>

        <p>

            ¿No tienes cuenta?

            <a
                href="register.html"
                class="register-link"
            >

                Registrarse

            </a>

        </p>

    </div>

    <a
   href="https://t.me/quinielamundialvipbot"
   target="_blank"
   class="telegram-btn"
>
   📲 Solicitar acceso
</a>

    <script src="login.js"></script>

</body>

</html>
